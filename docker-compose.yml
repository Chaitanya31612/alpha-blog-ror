version: "3.9"

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - alpha-blog-postgres:/var/lib/postgresql/data
  web:
    build: .
    volumes:
      - ./alpha-blog:/opt/app
    links:
      - postgres
    ports:
      - "3000:3000"

  # nginx:
  #   build:
  #     context: .
  #     dockerfile: ./Dockerfile.nginx
  #   ports:
  #     - "8020:8020"
volumes:
  alpha-blog-postgres:
